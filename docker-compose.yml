services:
  movieapi.application:
    image: ${DOCKER_REGISTRY-}movieapiapplication
    build:
      context: .
      dockerfile: MovieAPI.Application/Dockerfile
    depends_on:
      - fakeserver 
    environment:
      - HttpMovieRepository__UserAgent=movie-app-rb
  movieapi.database:
    image: postgres:17.4-alpine3.21
    container_name: movieapi.database
    environment:
      - POSTGRES_DB=movieapi
      - POSTGRES_USER=movieapi
      - POSTGRES_PASSWORD=movieapi
    volumes:
      - movieapi_postgres_data:/var/lib/postgresql/data
      # - ./.containers/movieapi.database:/var/lib/postgresql/data
    ports:
      - 5432:5432
  movieapi.elasticsearch:
    container_name: movieapi.elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.7.1
    environment: ['CLI_JAVA_OPTS=-Xms2g -Xmx2g','bootstrap.memory_lock=true','discovery.type=single-node','xpack.security.enabled=false', 'xpack.security.enrollment.enabled=false']
    ports:
      - 9200:9200
    networks:
      - elastic
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    deploy:    
      resources:
          limits:
            cpus: '2.0'
          reservations:
            cpus: '1.0'
  movieapi.kibana:
    image: docker.elastic.co/kibana/kibana:8.7.1
    container_name: movieapi.kibana
    depends_on:
      - movieapi.elasticsearch
    environment:
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: d1a66dfd-c4d3-4a0a-8290-2abcb83ab3aa
    ports:
      - 5601:5601
    networks:
      - elastic
    deploy:    
      resources:
          limits:
            cpus: '2.0'
          reservations:
            cpus: '1.0'
volumes:
  movieapi_postgres_data:
networks:
  elastic:  